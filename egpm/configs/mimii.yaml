# MIMII dataset overlay (PRD §3.1 primary dataset — unsupervised anomaly)
defaults:
  - base

data:
  dataset: mimii
  fs_sync: 16000.0          # MIMII clips are 16 kHz
  # one event token per ~1 s of audio (interpretability-first, PRD §6)
  window_length: 16000
  stride: null

vq:
  n_codes: 32               # richer audio vocabulary

hsmm:
  n_states: 4               # audio regimes: silence, steady, transient, abnormal
  d_max: 8

anomaly:
  threshold_percentile: 99.0 # val normal-only windows (PRD §11)
