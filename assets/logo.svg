<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="90" height="90" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D084" />
      <stop offset="50%" stop-color="#00843D" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00843D" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Outline with Subtle Glow -->
  <path d="M60 8 L104 24 C104 68 85 99 60 112 C35 99 16 68 16 24 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#primaryGrad)" 
        stroke-width="3" 
        stroke-linejoin="round" />

  <!-- Inner Geometric Framing -->
  <path d="M60 17 L96 30 C96 66 80 92 60 103 C40 92 24 66 24 30 Z" 
        fill="url(#accentGlow)" 
        stroke="#334155" 
        stroke-width="1.2" 
        stroke-linejoin="round" />

  <!-- Neuro-Symbolic Discrete Grammar Glyph -->
  <!-- Central Aegis Stylized Lambda / Delta Pulse Node -->
  <g filter="url(#glow)">
    <!-- Event Node Grid (Grammar States) -->
    <circle cx="60" cy="40" r="4" fill="#00D084" />
    <circle cx="42" cy="62" r="3.5" fill="#38BDF8" />
    <circle cx="78" cy="62" r="3.5" fill="#38BDF8" />
    <circle cx="60" cy="84" r="4.5" fill="#00D084" />

    <!-- Markov Transitions / Graph Edges -->
    <path d="M60 40 L42 62 M60 40 L78 62 M42 62 L60 84 M78 62 L60 84 M42 62 L78 62" 
          stroke="url(#primaryGrad)" 
          stroke-width="2.2" 
          stroke-linecap="round" />

    <!-- Waveform to Discrete Event Pulse -->
    <path d="M30 62 Q36 50 42 62 T54 62 T60 84 T66 62 T78 62 T90 62" 
          stroke="#F8FAFC" 
          stroke-width="1.5" 
          stroke-linecap="round" 
          fill="none" 
          opacity="0.85" />
  </g>
</svg>
