[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egpm"
version = "0.1.0"
description = "EGPM — Event Grammar Probabilistic Model (HSMM-based interpretable predictive maintenance)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["egpm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
