version: "3.9"

services:
  backend:
    build: .
    container_name: aegis-backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env

  dashboard:
    build: .
    container_name: aegis-dashboard
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - backend
    env_file:
      - .env

  simulator:
    build: .
    container_name: aegis-simulator
    command: python backend/simulator/modbus_simulator.py
    volumes:
      - .:/app
    depends_on:
      - backend
    env_file:
      - .env
